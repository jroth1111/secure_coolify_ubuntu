name: hardening-tests

on:
  pull_request:
  push:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Manual lane selection"
        required: true
        default: all
        type: choice
        options:
          - all
          - lint
          - unit-contracts
          - integration-core
          - integration-matrix
          - negative-matrix

permissions:
  contents: read

jobs:
  lint-docker:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'lint'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lint lane in Docker
        run: make test-lint-docker

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-docker-artifacts
          path: artifacts/
          if-no-files-found: ignore

  unit-contracts:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'unit-contracts'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit and contract lanes
        run: |
          make test-unit-docker
          make test-contracts

      - name: Upload unit/contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-contracts-artifacts
          path: artifacts/
          if-no-files-found: ignore

  integration-core:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'integration-core'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run core integration lanes
        run: make test-integration-core

      - name: Upload integration-core artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-artifacts
          path: artifacts/
          if-no-files-found: ignore

  integration-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'integration-matrix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run matrix integration lanes
        run: make test-integration-matrix

      - name: Upload integration-matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-matrix-artifacts
          path: artifacts/
          if-no-files-found: ignore

  negative-matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.lane == 'all' || inputs.lane == 'negative-matrix'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run negative matrix lanes
        run: make test-negative-matrix

      - name: Upload negative-matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negative-matrix-artifacts
          path: artifacts/
          if-no-files-found: ignore
